id: calc-balance
kind: behavior
namespace: calc
entities: []
title: баланс предметов — итог плана относительно цели, излишек, добыча, дефицит; ленты и трубы по пропускной способности
scenarios:
  - given: план с целью
    when: расчёт баланса
    then: итог плана делится на цель (предмет цели)
  - given: предмет с итогом больше нуля
    when: расчёт баланса
    then: излишек
  - given: сырьё с итогом меньше нуля
    when: расчёт баланса
    then: добыча
  - given: предмет, не являющийся сырьём, с итогом меньше нуля
    when: расчёт баланса
    then: дефицит
  - given: поток по модулю меньше 1e-4 в минуту
    when: расчёт баланса
    then: ноль
  - given: поток в лентах или трубах и выбранный уровень
    when: расчёт баланса
    then: число лент или труб = |поток| / пропускная способность выбранного уровня; трубы Mk.1 при лентах Mk.1, у Mk.2 пропускная способность выше
check: npm test
verified: false
verified_at: 2026-10-29
verified_note: "переезд на один vitest (npm test), прогон за verify; прежде: npm --prefix src/engine test — 29/29 (2026-10-29): «classifies the balance», «counts belts for a flow». Порог 1e-4 и трубы Mk.2 отдельным тестом не покрыты"
