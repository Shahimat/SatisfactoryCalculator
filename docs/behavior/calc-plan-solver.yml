id: calc-plan-solver
kind: behavior
namespace: calc
entities: [recipe, building]
title: решатель плана — строки, цели, режимы sequential и matrix; fixed-строка не меняется, auto добирает остаток, здания целые и не отрицательные
scenarios:
  - given: план с целями {item, perMinute} и режимом sequential или matrix
    when: расчёт плана
    then: цели и режим учитываются; режим задаёт сам план
  - given: строка рецепта или добычи без явного режима, у плана есть цели
    when: расчёт плана
    then: строка auto
  - given: строка рецепта или добычи без явного режима, у плана нет целей
    when: расчёт плана
    then: строка fixed
  - given: fixed-строка в любом режиме
    when: расчёт плана
    then: решатель не меняет её здания; её потоки вносятся как заданы
  - given: строка рецепта или добычи с output {item, perMinute} — закреп выхода одного продукта, в том числе побочного
    when: расчёт плана
    then: перед решением здания строки считаются ровно под этот выход (rowForOutput); выход продукта равен заданному числу без прибавки потребления других строк; строка fixed в обоих режимах; разгон и петлевики сохраняются
  - given: строка с output, в окне правки задано число зданий
    when: сохранение строки
    then: output сохраняется, здания записываются в buildings; разгон подстраивается под output (до maxClock здания, сверх — нехватка); петлевики сохраняются
  - given: строка auto или с output, в окне правки задано число зданий без петлевиков
    when: расчёт плана
    then: buildings — число зданий от пользователя; разгон подбирается под нужный выход до maxClock; сверх maxClock — нехватка, здания не добавляются
  - given: строка auto или с output, в окне правки поле зданий пусто
    when: расчёт плана
    then: решатель подбирает целые здания; разгон при 100 % — ровный пониженный (2.5 → 3 здания по 83.33 %); заданный разгон не 100 % сохраняется, число зданий округляется
  - given: строка с output, в окне правки выбрано «Авто»
    when: сохранение строки
    then: output снимается, разгон сбрасывается на 100 %; строка возвращается решателю (режим по умолчанию — см. ui-calc-row-order)
  - given: строка с output, в чипе выхода поле очищено (Enter или уход из поля)
    when: сохранение строки
    then: output снимается, строка auto; цель плана на этот продукт тоже снимается, если она была; с продукта ничего не требуется
  - given: fixed-строка с недостачей продукта
    when: расчёт плана
    then: недостача не закрывается решателем, остаётся отрицательным балансом, статус ok
  - given: fixed-строка и auto-строка одного продукта, в том числе другим рецептом
    when: расчёт плана
    then: auto-строка добирает остаток в обоих режимах
  - given: две auto-строки одного продукта в режиме matrix
    when: расчёт плана
    then: выбирается минимум зданий; пропорция не делится — долю задают fixed-строкой или цехом
  - given: нужно отрицательное число зданий
    when: расчёт плана
    then: число зданий не бывает отрицательным; излишек оставляет auto-строку с 0 зданий и виден в балансе
  - given: режим sequential, цели и строки сверху вниз
    when: расчёт плана
    then: auto-строка покрывает нехватку первого своего продукта у целей и строк выше; порядок важен; перестановка перетаскиванием пересчитывает план
  - given: режим matrix, цели и auto-строки
    when: расчёт плана
    then: линейная программа — минимум зданий без петлевиков при чистом выходе не ниже цели и не ниже 0 для продуктов auto-строк; порядок строк не важен; петли с возвратом (вода в алюминии) сходятся
  - given: режим matrix, цель недостижима
    when: расчёт плана
    then: status infeasible, плашка; здания остаются как введены
  - given: auto-строка с петлевиками, поставленными пользователем
    when: расчёт плана
    then: решатель подбирает здания только без петлевиков
  - given: строка цеха или завода в «авто»
    when: расчёт плана
    then: число копий подбирает решатель целыми; неполная последняя копия работает с пониженной загрузкой (1.25 → 2 копии, последняя 25 %); загрузка в пределах 1 % от целого — целая; её вложенный план решается своим режимом
  - given: строка цеха или завода с закреплёнными копиями
    when: расчёт плана
    then: копии как заданы, решатель их не меняет; потоки умножаются на копии
  - given: решение при разгоне 100 % даёт дробное число зданий — в том числе у группы с петлевиками
    when: расчёт плана
    then: целые здания с ровным пониженным разгоном, дробного числа зданий нет; у группы с петлевиками петлевики те же (0.667 → 1 здание на 66.7 %); потоки меньше 1e-4 в минуту — ноль
check: npm test
verified: false
verified_at: 2026-10-30
verified_note: "переезд на один vitest (npm test), прогон за verify; прежде: npm --prefix src/engine test — 36/36 (2026-10-30): «sizes an auto workshop in whole copies, the last one partly loaded», «multiplies a workshop by its copies», «includes another calculation as a plant» — цех и завод в решателе покрыты. Прежний прогон 34/34 (2026-10-29): «keeps a fixed row as set and lets an auto row of the same item cover the rest», «leaves a shortfall of a fixed row as a deficit», «never makes a negative building count», «does not depend on row order», «pulls the whole chain from a goal», «adds a goal on top of what other rows consume», «balances a loop that returns water», «keeps an auto row empty when nothing needs it», «reports goals that cannot be met», «resizes a row to a requested output», «locks a row at an exact output of one of its products», «sizes top to bottom in sequential mode», «builds whole buildings evenly underclocked…», «keeps a clock set on purpose…», «adapts the clock to a building count chosen by the user», «cuts Somersloop buildings to whole underclocked ones». Отдельным тестом не покрыто: минимум зданий между двумя auto-строками, выбор auto/fixed по наличию целей, цех и завод в решателе; сценарии правки строки (поле зданий, «Авто» снимает output и сбрасывает разгон) — только по коду src/components/edit-row.tsx, без теста; очистка чипа выхода снимает output и цель на продукт — только в браузере 2026-10-29 (автопроводка 60 и разъём 34, очистка чипа разъёма → цель снята, разъём 49 → 15), без теста"
