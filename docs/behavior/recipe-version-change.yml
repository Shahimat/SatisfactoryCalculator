id: recipe-version-change
kind: behavior
namespace: calc
entities: [recipe, game-catalog]
title: смена версии игры — расчёт и цех помнят подписи рецептов; изменённый рецепт помечается changed, пропавший — removed
scenarios:
  - given: расчёт или цех сохранены на версии игры с подписями рецептов (здание, цикл, входы, выходы, переменная мощность)
    when: открыт на другой версии каталога, у рецепта другая подпись
    then: рецепт помечен changed; строка пересчитана, жёлтая рамка
  - given: расчёт или цех сохранены на версии игры, рецепта нет в другой версии
    when: открыт на другой версии каталога
    then: рецепт помечен removed; строка не считается, красная рамка
  - given: рецепт помечен changed или removed
    when: нажато «принять»
    then: текущая версия каталога становится базой для подписей
check: npm test
verified: false
verified_at: 2026-10-29
verified_note: "переезд на один vitest (npm test), прогон за verify; прежде: npm --prefix src/engine test — 29/29 (2026-10-29): «detects changed and removed recipes». Сценарий «принять» (acknowledgeVersion в src/calc.ts) и рамки в интерфейсе тестом не покрыты"
