key: ui-interaction-checks
title: Проверки взаимодействий в браузере
status: planned
why: регрессия autoFocus после перехода на Preact найдена пользователем; статичные скриншоты scripts/visual фокус не проверяют
description: |
  Автоматические проверки клика, фокуса и ввода в headless Chrome для экранов
  с кнопками и полями. Сейчас scripts/visual/screenshots.ts проверяет только
  ввод: состояние обновляется на каждом символе. Фокус после открытия окна
  и поля не проверяется. Правило ui-no-autofocus запрещает autoFocus, проверка
  должна ловить его возврат. Открыто: отдельный прогон или расширение screenshots.ts.
tasks:
  blocker: []
  high:
    - "проверка фокуса после открытия окон и полей, с ловлей регрессии autoFocus → test"
  medium:
    - "проверка клика и ввода по экранам с кнопками и полями, отдельно от скриншотов → test"
  low: []
depends_on: []
