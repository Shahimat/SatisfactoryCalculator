key: workshop-entity
title: Цех как сущность в модели и расчёте
status: planned
why: |
  Цех — переиспользуемая цепь рецептов с агрегатами входа, выхода и энергии (CHANGELOG, arch 2026-10-28). В UI цех уже подключается в расчёт одним блоком с множителем копий (context/conventions/ui-calc-connect-workshop.yml), но в модели сущности нет: docs/scheme/model.puml её не описывает.
description: |
  Цех — чертёж-цепь: подключается в расчёт целиком одним блоком, у блока есть свой вход, выход и энергия. Строки подключённого цеха в расчёте сворачиваются в блок.
  UI-источники: раздел «Цеха» и редактор с панелью «Интерфейс цеха» — context/conventions/ui-workshop-view.yml; Penpot Design System, экраны 03, 04, 06.
  Открытые вопросы: связь с существующими сущностями model.puml (factory, scheme) — новая сущность или уточнение существующей; заводить ли docs/entities/workshop.yml вместе с model.puml.
