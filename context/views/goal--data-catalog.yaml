key: data-catalog
title: Каталог из файлов игры
status: planned
why: |
  Калькулятор работает на данных конкретной версии игры. Решение 2026-10-28 (гибрид): файлы игры кладутся вручную в data/raw/<версия>/, CI нормализует их в каталог. satisfactory-calculator.com не даёт API и условий повторного использования.
description: |
  Нормализация файлов игры (CommunityResources/Docs/*.json) в каталог рецептов, зданий и предметов — namespace catalog, docs/entities/. Версия и дата сборки выводятся в шапке справочника (convention ui-reference-readonly). Правила сборки — convention data-game-sources.
