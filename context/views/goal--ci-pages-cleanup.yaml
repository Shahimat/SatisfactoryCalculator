key: ci-pages-cleanup
title: CI публикации на Pages и удаление src/srv, src/srv-nest
status: planned
why: |
  Сайт без сервера публикуется на GitHub Pages по пути /satisfactory-calculator/ (CHANGELOG, stack 2026-10-28). Серверные src/srv и src/srv-nest тогда не нужны.
