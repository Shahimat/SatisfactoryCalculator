key: ui-static-storage
title: Статический интерфейс — хранение в браузере, экспорт и импорт
status: planned
why: |
  Калькулятор становится статическим сайтом на GitHub Pages без сервера (CHANGELOG, stack 2026-10-28). Пользователь обменивается расчётами файлами, поэтому нужны экспорт, импорт и uuid.
description: |
  Интерфейс src/ui построен: расчёты, цеха и заводы в браузере (data-browser-storage), uuid (data-entity-id), выборочный экспорт (ui-export-selection), импорт с одним решением на весь файл (ui-import-conflicts), пересчёт при смене версии (data-version-update), петлевики группами (ui-calc-amplify-groups), справочник только для чтения (ui-reference-readonly).
  src/ui-old остаётся, пока новый интерфейс не повторит его возможности; удаляется отдельно.
tasks:
