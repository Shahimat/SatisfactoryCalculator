# generated by ai context index — do not edit manually
conventions:
  comments: комментарии только для неочевидного «почему»; по умолчанию их нет
  data-browser-storage: расчёты, цеха и заводы хранятся в браузере пользователя; обмен — файлом JSON через экспорт и импорт, сервера нет
  data-calc-goals-storage: расчёт и цех хранят goals [{item, perMinute}] и solver вместо targets; строка рецепта или добычи хранит output {item, perMinute} — закреп выхода продукта; старые расчёты переводятся при загрузке и импорте в цели и режим «Сверху вниз»
  data-entity-id: сущности пользователя (расчёты, цеха, заводы) получают uuid; импорт сопоставляет по uuid, копия получает новый uuid
  data-game-sources: исходные файлы игры кладутся вручную в data/raw/<версия>/; CI нормализует их в каталог, подтягивает иконки с вики с кешем и паузами, собирает и публикует сайт
  data-version-update: "расчёт из файла или сохранённый на другой версии игры пересчитывается по новым данным; плашка «Данные игры обновились: X → Y», изменённые рецепты — оранжевая рамка, удалённые — красная, «замените»"
  goal-done-remove: полностью выполненная цель удаляется из очереди без отдельного вопроса — файл goal--<key>.yaml и строка в goals.yaml; история — в git и CHANGELOG
  ui-accent-yellow: жёлтый акцент — только для действий и выделения; жёлтая молния энергии в потоке — исключение
  ui-brand-logo: в шапке — логотип Satisfactory со ссылкой на расчёт; фавиконка — значок «S»; оба взяты из макета Penpot
  ui-calc-add-recipe: рецепт в расчёт добавляется от цели — предмет, выход и разгон, затем предложение рецептов с итогом
  ui-calc-add-tabs: окно «Добавить» имеет вкладки «Добыча» и «Генератор» — добыча и генераторы добавляются в расчёт через них
  ui-calc-amplify-groups: петлевики в строке расчёта задаются группами зданий в одной фишке (например ×8 без и ×2 с ◆1/1); в настройках строки — кнопка «Группа с другим разгоном»; в шапке расчёта — число использованных петлевиков
  ui-calc-belt-units: потоки расчёта можно показать в лентах — переключатель единиц в шапке расчёта; число лент = шт/мин ÷ пропускная способность ленты выбранного уровня
  ui-calc-build-cost: внизу расчёта — «Ресурсы на постройку» — стоимость всех целых зданий плана по buildCost, энергомодулей и петлевиков, вставленных в здания; здания цехов × копии; заводы не входят — их строят в своём расчёте
  ui-calc-build-strip: «Итого» стоит первой карточкой над строками расчёта; здания к постройке — компактные чипы в колонке «Здания» карточки «Итого» (иконка и ×целых, имя во всплывашке); цеха и заводы — значок, ×копий, имя; отдельной полосы нет
  ui-calc-building-modal: окно «Здание» по клику на чип зданий строки — здание и рецепт, построить целых и загрузка, энергия, потоки одного здания по группам и всей строки, стоимость постройки одного здания и всех; показывает число зданий после решателя
  ui-calc-connect-workshop: цех и завод подключаются модалкой «Подключить цех» / «Подключить завод» без поля копий — строка ×1, копии подбирает решатель; у каждого варианта входы и выходы одной копии чипами
  ui-calc-fixed-row-highlight: строка, закреплённая числом зданий, подсвечена жёлтой полосой слева и тегом «закреплено» в чипе зданий; строка, закреплённая выходом продукта, — замок на чипе этого продукта и на чипе «Итого» (если цели нет); строка «авто» — тег «авто»
  ui-calc-goals: цель вводится прямо в чипе выхода «Итого» — число и Enter задают цель, пустое поле и Enter или уход из поля снимают, и закреп строк на этот продукт снимается (строки → авто); цель отмечена значком мишени; окна «Нужно на выходе» нет; цель можно поставить промежуточному продукту
  ui-calc-group-into-plant: у любой выделенной строки расчёта кнопка «В завод (N)» — строки уходят в новый расчёт-завод «Завод из «…»», на их месте строка завода ×1
  ui-calc-group-into-workshop: выделенные строки расчёта кнопкой «В цех (N)» переносятся в новый цех; при выделении цеха или завода — кнопка «Раскрыть (N)» — сущность заменяется своими строками ×поставленных копий, в хранилище остаётся
  ui-calc-header: шапка расчёта — строки, поставленные целые здания и петлевики; перечня целей в шапке нет, цели видны значком мишени на чипах «Итого»
  ui-calc-pick-consumption: клик по чипу потребления в строке или в «Итого» открывает «Добавить» с предметом и количеством; сырьё — во вкладке «Добыча»; подобранный рецепт не становится целью
  ui-calc-row-card: карточка строки без чекбокса — клик выделяет и снимает выделение; название переносится и кликается только по тексту (inline), клик по пустому месту рядом выделяет карточку; клик по названию открывает настройки строки, клик по чипу зданий — окно «Здание»; подписи здания и выхода на здание нет
  ui-calc-row-order: порядок строк задаёт снабжение только в режиме «Сверху вниз» — строка «авто» покрывает цели и нехватку выше; в «Матрице» порядок не влияет; режим строки — «авто» / «зафиксировать здания»; выход цеха и завода в чипе не редактируется
  ui-calc-row-output: выход строки рецепта или добычи закрепляется прямо в чипе выхода — число и Enter закрепляют строку на этом продукте, пустое поле и Enter или уход из поля возвращают «авто» и снимают цель плана на этот продукт, Esc отменяет; чип отмечает цель мишенью; окон и кнопок нет
  ui-calc-solver-mode: режим расчёта «Матрица» (по умолчанию для новых) или «Сверху вниз»; «Матрица» решает все строки «авто» вместе, недостижимые цели — плашка
  ui-calc-view-card: основной вид расчёта карточный — «Итого» первой карточкой над строками; строка = рецепт | цепь | завод | итог; баланс по предметам не показывается
  ui-calc-workshop-copies: чип копий цеха или завода — ×целых копий, тег «последняя N %» при неполной загрузке, «авто» или «закреплено»; в окне правки — «Авто» / «Зафиксировать копии»
  ui-column-widths: колонки Потребление, Производство и Энергия одной ширины во всех строках
  ui-css-layers: стили UI — глобальные в styles.css и utilities.css, компонентные — CSS Modules рядом с компонентом, классы склеиваются cx
  ui-design-tokens: основа дизайн-системы — тёмная палитра из доски «Колористика», токены core и semantic, шрифты Roboto
  ui-deviation-highlight: отклонения подсвечиваются — разгон ≠ 100% оранжевым, дефицит красной рамкой
  ui-export-selection: экспорт выборочный — чеклист расчётов, цехов и заводов и «Выбрать всё — полный бэкап»; зависимости включаются автоматически с пометкой «нужен для …»
  ui-factories-view: раздел «Заводы» — построенные расчёты («Построено ×N» или «Черновик») и сводка энергосети сверху
  ui-field-anchor-icons: поля окон расчёта — иконки-якоря (здание, энергомодуль, петлевик, предмет); окно правки строки открывается шапкой с иконкой здания и рецептом
  ui-flow-direction-colors: направление потока кодируется цветом — вход красный, выход зелёный, жидкость синяя, энергия жёлтая молния
  ui-i18n-catalog-names: названия каталога на выбранном языке через localName, сортировка через compareNames; поиск справочника — по обоим языкам; имена расчётов и цехов пользователя не переводятся
  ui-i18n-english-terms: английская версия — термины из английских названий игры (Calculations, Workshops, Factories, Reference, Somersloop, Clock speed, Impure, Normal, Pure); русская — Заводы для Factories
  ui-i18n-locale-switch: переключатель RU/EN — в верхней панели рядом с «Единицами»; первый заход — язык браузера; выбор хранится в localStorage satisfactory-calculator/locale, не в состоянии и не в экспорте
  ui-i18n-messages: строки интерфейса — только в src/i18n/ru.ts (эталон, тип Messages) и en.ts; t читается при рендере, не в константах модуля; счётные слова — через countLabel и PluralForms
  ui-immutable-state: состояние UI иммутабельно — правки новыми объектами плана, цеха или расчёта; результат evaluate общий из кеша и не мутируется
  ui-import-conflicts: импорт показывает содержимое со статусами «Новый» и «Уже есть» (по uuid); для совпадений одно решение на весь импорт — «Добавить копией» или «Заменить существующие»
  ui-monospace-numbers: числа набираются моноширинным шрифтом
  ui-navigation-sections: навигация — четыре раздела (Расчёты, Цеха, Заводы, Справочник)
  ui-no-autofocus: в src/ не использовать autoFocus — фокус ставится ref-колбэком focusOnMount
  ui-no-text-selection: выделение текста в интерфейсе отключено — экран из карточек; в полях ввода выделение работает
  ui-no-top-level-await: в src без top-level await — Prefresh (HMR в dev) снимает $RefreshSig$ до продолжения модуля и падает
  ui-number-sign: у числа всегда виден знак (−30 / +30)
  ui-preact-hooks: в UI хуки и типы импортируются из 'react' (alias на preact/compat), не из preact/hooks; у событий читается event.currentTarget до колбэка обновления
  ui-reference-readonly: справочник (рецепты, здания, предметы) только для чтения — редакторов нет; в шапке версия данных игры и дата сборки; у зданий колонка «Петлевики»
  ui-select-icons: выпадающие списки — свой компонент Select с иконками игры и поиском от 10 вариантов; системный select картинки не показывает
  ui-split-scroll: раздельная прокрутка — верхняя панель и левое меню на месте, контент прокручивается отдельно; шапка страницы и заголовки расчёта с карточкой «Итого» прилипают сверху контента
  ui-workshop-view: цех — библиотека карточек и редактор с панелью «Интерфейс цеха»
namespaces:
  catalog:
    description: справочник — рецепт, здание, предмет (docs/entities)
    entities:
      building: производственное здание — мощность от разгона и усиления петлевиками; энергия принадлежит зданию, не рецепту
      game-catalog: каталог 1.2 — рецепты, здания, предметы и логистика из файлов игры; генерируется в data/catalog/<версия>.json, в git не хранится
      recipe: рецепт — входы, выходы и длительность цикла; собственной энергии нет, энергия принадлежит зданию
    behaviors:
      building-power: мощность здания по power.formula — разгон и петлевики; выход множится на петлевики, вход не растёт
      catalog-build: сборка каталога из data/raw/<версия> — рецепты, здания, предметы, логистика; падает при несовпадении sha256
    manuals:
      data-add-game-version: Добавить новую версию игры в каталог
      publish-pages: Опубликовать сайт калькулятора на GitHub Pages
  calc:
    description: расчёты — решатель плана, потоки строк, баланс, смена версии игры (docs/behavior)
    behaviors:
      calc-balance: баланс предметов — итог плана относительно цели, излишек, добыча, дефицит; ленты и трубы по пропускной способности
      calc-plan-solver: решатель плана — строки, цели, режимы sequential и matrix; fixed-строка не меняется, auto добирает остаток, здания целые и не отрицательные
      calc-row-flows: потоки строки — группы зданий с петлевиками, переменная мощность, добыча по чистоте узла, генераторы, цехи и заводы
      recipe-version-change: смена версии игры — расчёт и цех помнят подписи рецептов; изменённый рецепт помечается changed, пропавший — removed
  exchange:
    description: обмен JSON — экспорт, импорт, копии (docs/behavior)
    behaviors:
      data-exchange: обмен JSON — экспорт с транзитивными зависимостями, импорт по uuid, копии с новыми uuid или замена на месте
