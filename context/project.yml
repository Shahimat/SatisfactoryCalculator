name: satisfactory-calculator
summary: калькулятор производственных цепочек Satisfactory
stack: [typescript, preact (API React через preact/compat), rsbuild, css-modules, vitest]
reality: [this-repo]
preset: operational
license: "код — MIT (LICENSE, package.json); данные игры data/raw/ и иконки — Coffee Stain Studios, под MIT не входят"
namespaces:
  catalog: справочник — рецепт, здание, предмет (docs/entities)
  calc: расчёты — решатель плана, потоки строк, баланс, смена версии игры (docs/behavior)
  exchange: обмен JSON — экспорт, импорт, копии (docs/behavior)
  site: статический сайт — сборка, визуальная проверка, публикация на GitHub Pages (docs/entities)
external:
  penpot: дизайн UI — файл «Satisfactory», страница «Design System»; компонент lang-switch, в topbar всех экранов блок «Язык» после блока «Единицы»; Page 1 — черновик из Figma, не источник
  icons: satisfactory.wiki.gg, Special:FilePath/<Name>.png
  pages: GitHub Pages — статический сайт https://shahimat.github.io/SatisfactoryCalculator/ (репозиторий Shahimat/SatisfactoryCalculator, публичный; на бесплатном тарифе Pages только у публичного репозитория); в Settings → Pages источник «GitHub Actions»; детали CI — docs/entities/site.yml
  game_data: data/raw/<версия>/ — файлы игры, кладутся вручную; правила — convention data-game-sources
