summary: чип выхода в «Итого» правит итог продукта целиком — любое применение ввода (число и Enter, пусто и Enter, уход из пустого поля) снимает закреп выхода у строк на этот продукт (строки → авто); при закрепе строки чип «Итого» помечен замком, если цели на продукт нет
source: намерения основной сессии 2026-10-30 — баг «зафиксированный разъём не снимается с «Итого»» (пользователь 2026-10-30)
