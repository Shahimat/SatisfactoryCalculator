summary: в расчёте под прилипшей шапкой страницы прилипают и заголовки колонок с карточкой «Итого»; прокручиваются только строки и блок «Ресурсы на постройку»
source: намерение основной сессии 2026-10-30 — пересмотр ui-split-scroll по просьбе пользователя «Давай итого тоже не прокручивать, пусть будет тоже в зоне шапки»
items:
  - op: revise
    kind: rule
    target: context/conventions/ui-split-scroll.yml
    summary: под шапкой страницы прилипают заголовки колонок расчёта и карточка «Итого» (с предупреждением о недостижимых целях); прокручиваются строки расчёта и блок «Ресурсы на постройку»
    evidence: "src/ui/src/components/rows.tsx (.calc-head с col-header и TotalRow), src/ui/src/styles.css (.calc-head position sticky, top calc(var(--page-header-height) - 24px)), src/ui/src/screens/calculations.tsx (ResizeObserver пишет --page-header-height); браузер 2026-10-30"
    was: прилипает только шапка страницы; контент, в том числе «Итого», прокручивается вместе со строками
    why: пользователь 2026-10-30 — «Давай итого тоже не прокручивать, пусть будет тоже в зоне шапки»
