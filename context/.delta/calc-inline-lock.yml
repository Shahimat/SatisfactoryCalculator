    target: docs/behavior/calc-plan-solver.yml
    summary: строка с output {item, perMinute} перед решением получает здания ровно под этот выход (rowForOutput) и считается fixed в обоих режимах; закреп возможен и на побочном продукте
    evidence: src/engine/src/calc/sizing.ts (lockOutputs); npm --prefix src/engine test — 30/30, «locks a row at an exact output of one of its products»
    was: выход задавался числом зданий в окне; строка с заданным выходом — выход равен числу без прибавки потребления
    why: закреп переехал на продукт строки (output); поведение без прибавки то же
