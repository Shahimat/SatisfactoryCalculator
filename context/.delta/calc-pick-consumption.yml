    summary: клик по чипу потребления в строке или «Итого» и по чипу «Дефицит» / «Добыча» в балансе открывает «Добавить» с предметом и количеством; сырьё — во вкладке «Добыча» с подходящим зданием и числом зданий; подобранный рецепт не становится целью, это промежуточный продукт
