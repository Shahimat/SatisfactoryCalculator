summary: подбор рецепта по клику на потребление — чип в строке и «Итого», дефицит и добыча в балансе открывают «Добавить» с предметом
source: намерения основной сессии 2026-10-28; просьба пользователя «не могу нажать на иконку потребления, чтобы добавить цепочку»
