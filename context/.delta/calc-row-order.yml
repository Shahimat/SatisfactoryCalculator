summary: порядок строк расчёта задаёт снабжение — режим «авто / вручную» у строки и перетаскивание
source: намерения основной сессии 2026-10-28 — просьба пользователя «надо уметь переставлять руками порядок строчек» (кейс с проволокой)
items:
  - op: add
    kind: decision
    target: CHANGELOG.md
    summary: порядок строк расчёта задаёт снабжение сверху вниз; перестановка перетаскиванием меняет объёмы
    evidence: src/engine/src/calc/sizing.ts (sizeRows, 4 теста в src/engine/test/calc/calc.spec.ts); проверено в браузере — статор выше проволоки → проволока ×20 → ×28, +840 шт/мин
  - op: add
    kind: rule
    target: context/conventions/ui-calc-row-order.yml
    summary: строка рецепта или добычи в режиме «авто» покрывает чистую нехватку своего продукта у строк выше; режим переключается в окне правки строки; по умолчанию «вручную» у строк цели, у расчётов без цели и в цехе
    evidence: src/ui/src/calc.ts (isAutoRow), src/ui/src/components/rows.tsx (подсказка «перетащите ниже потребителей»); просьба пользователя 2026-10-28
  - op: refine
    kind: rule
    target: context/conventions/ui-calc-pick-consumption.yml
    summary: строка, подобранная кликом по потреблению, получает режим «авто» (см. ui-calc-row-order)
    evidence: просьба пользователя 2026-10-28; src/ui/src/screens/calculations.tsx (picked → addRow)
