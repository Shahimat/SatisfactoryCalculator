summary: формальные требования расчёта и обмена — namespaces calc и exchange, пять behavior-документов, обратные ссылки из entities; базовая линия перед крупным рефактором
source: намерения основной сессии 2026-10-29 — ответ пользователя «1 - 1, 2 - 1» (завести namespaces, закрыть calc-row-output), просьба «фиксировать все доменные требования формально… потом крупный рефактор»
items:
  - op: add
    kind: decision
    target: context/project.yml
    summary: namespaces calc (решатель, потоки, баланс, смена версии) и exchange (импорт/экспорт) — для behavior-документов
    evidence: ответ пользователя 2026-10-29 «1 - 1, 2 - 1»
  - op: add
    kind: decision
    target: CHANGELOG.md
    summary: namespaces calc и exchange завели, требования расчёта и обмена зафиксированы в docs/behavior перед крупным рефактором
    evidence: просьба пользователя 2026-10-29; ответ «1 - 1»
  - op: add
    kind: behavior-change
    target: docs/behavior/calc-plan-solver.yml
    summary: решатель плана — строки, цели, режимы sequential и matrix, fixed и auto, петлевики, цеха и заводы в решателе
    evidence: src/engine/src/calc/sizing.ts, simplex.ts; npm --prefix src/engine test — 29/29
  - op: add
    kind: behavior-change
    target: docs/behavior/calc-row-flows.yml
    summary: потоки строки — группы зданий с петлевиками, переменная мощность, добыча по чистоте узла, генераторы, цехи и заводы
    evidence: src/engine/src/calc/flows.ts; npm --prefix src/engine test — 29/29
  - op: add
    kind: behavior-change
    target: docs/behavior/calc-balance.yml
    summary: баланс предметов — итог относительно цели, излишек, добыча, дефицит; ленты и трубы по пропускной способности
    evidence: src/engine/src/calc/analysis.ts (balance, FLOW_EPSILON, carriers); src/ui/src/calc.ts (flowValue); npm --prefix src/engine test — 29/29
  - op: add
    kind: behavior-change
    target: docs/behavior/recipe-version-change.yml
    summary: смена версии игры — подписи рецептов, пометки changed и removed, «принять» берёт текущую версию как базу
    evidence: src/engine/src/calc/analysis.ts (recipeSignature, recipeChanges); src/ui/src/calc.ts (versionChanges, acknowledgeVersion); npm --prefix src/engine test — 29/29
  - op: add
    kind: behavior-change
    target: docs/behavior/data-exchange.yml
    summary: обмен JSON — экспорт с транзитивными зависимостями, импорт по uuid, копия или замена на месте, перевод старых планов
    evidence: src/ui/src/exchange.ts; npm --prefix src/ui test — 16/16
  - op: refine
    kind: fact
    target: docs/entities/recipe.yml
    summary: recipe ссылается на behaviors calc-plan-solver, calc-row-flows, recipe-version-change
    evidence: docs/behavior/calc-plan-solver.yml, calc-row-flows.yml, recipe-version-change.yml (поле entities)
  - op: refine
    kind: fact
    target: docs/entities/building.yml
    summary: building ссылается на behaviors calc-plan-solver и calc-row-flows, сохраняет building-power
    evidence: docs/behavior/calc-plan-solver.yml, calc-row-flows.yml (поле entities)
  - op: refine
    kind: fact
    target: docs/entities/game-catalog.yml
    summary: game-catalog ссылается на behavior recipe-version-change, сохраняет catalog-build
    evidence: docs/behavior/recipe-version-change.yml (поле entities)
