    summary: "Calculation хранит goals: [{item id, perMinute}] и solver: sequential | matrix вместо targets"
    evidence: "src/ui/src/model.ts (Plan — goals, solver); context/conventions/data-calc-goals-storage.yml"
    was: "Calculation.targets: [item id]"
    why: цели на выходе с количеством в минуту заменили список предметов; режим расчёта — новое поле
  - op: add
    kind: fact
    target: docs/scheme/model.puml
    summary: "Workshop хранит goals: [{item id, perMinute}] и solver: sequential | matrix — как Calculation"
