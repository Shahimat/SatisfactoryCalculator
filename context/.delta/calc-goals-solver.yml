summary: расчёт по целям на выходе — режимы «Матрица» (линейная программа) и «Сверху вниз», окно «Нужно на выходе», строки «авто» / «зафиксировать здания», хранилище goals и solver
source: намерения основной сессии 2026-10-28 — просьба пользователя «посмотри helmod… фиксация объема под конкретный запрос… helmod крайне плохо рассчитывает петлю, алюминий»
items:
  - op: add
    kind: decision
    target: CHANGELOG.md
    summary: выход задаёт цель на выходе, запас строки убран · промежуточный продукт поднимается целью, как в Helmod
    evidence: скриншот пользователя 2026-10-28 («Запас сверх потребности — так не надо делать»); src/ui/src/components/goal-modal.tsx, edit-row.tsx
  - op: add
    kind: decision
    target: CHANGELOG.md
    summary: режим «Матрица» — линейная программа по целям · петли с возвратом сходятся, порядок строк не важен; «Сверху вниз» остаётся
    evidence: "src/engine/src/calc/simplex.ts, sizing.ts (solve, solveSequential, solveRows; 9 тестов); проверено в браузере — алюминий 60/мин: вода 270 − 30 возврат = 240 насосами"
  - op: add
    kind: rule
    target: context/conventions/ui-calc-goals.yml
    summary: цель задаётся окном «Нужно на выходе» по клику на чип выхода в строке или в «Итого»; цель можно поставить промежуточному продукту; «Убрать из целей»
    evidence: src/ui/src/components/goal-modal.tsx; скриншот и просьба пользователя 2026-10-28
  - op: add
    kind: rule
    target: context/conventions/ui-calc-solver-mode.yml
    summary: режим расчёта «Матрица» (по умолчанию для новых) или «Сверху вниз»; «Матрица» решает строки «авто» вместе, недостижимые цели — плашка
    evidence: src/engine/src/calc/simplex.ts, sizing.ts; src/ui/src/components/solver-toggle.tsx; просьба пользователя 2026-10-28
  - op: revise
    kind: rule
    target: context/conventions/ui-calc-row-order.yml
    summary: порядок строк задаёт снабжение только в режиме «Сверху вниз»; в «Матрице» порядок на объёмы не влияет; режим строки — «авто» / «зафиксировать здания»; без явного режима — «авто», если у плана есть цели
    evidence: src/ui/src/calc.ts (isAutoRow); src/engine/src/calc/sizing.ts; просьба пользователя 2026-10-28
    was: "порядок строк расчёта определяет снабжение — расчёт идёт сверху вниз; режим «авто / вручную»; по умолчанию «вручную» у строк цели"
    why: режим «Матрица» решает строки вместе, порядок не важен; строки цели заменены целями на выходе, «вручную» стало «зафиксировать здания»
  - op: revise
    kind: rule
    target: context/conventions/ui-calc-row-output.yml
    summary: выход строки задаётся целью (клик по чипу выхода) или у зафиксированной строки полем «Нужный выход»; поля «Запас сверх потребности» нет
    evidence: src/ui/src/components/edit-row.tsx; скриншот пользователя 2026-10-28 («Запас сверх потребности — так не надо делать»)
    was: "выход строки задаётся в окне правки — «Нужный выход» у строки «вручную», «Запас сверх потребности» у строки «авто»; клик по чипу выхода открывает окно правки"
    why: запас убран по решению пользователя — промежуточный продукт поднимается целью; клик по чипу выхода теперь задаёт цель
  - op: add
    kind: rule
    target: context/conventions/data-calc-goals-storage.yml
    summary: расчёт и цех хранят goals [{item, perMinute}] и solver вместо targets; старые расчёты переводятся при загрузке и импорте в цели и режим «Сверху вниз»
    evidence: src/ui/src/model.ts (Plan), src/ui/src/calc.ts (migratePlan), src/ui/src/store.ts, src/ui/src/components/exchange-modals.tsx
  - op: revise
    kind: fact
