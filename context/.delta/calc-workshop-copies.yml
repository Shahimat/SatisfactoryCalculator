    evidence: src/engine/src/calc/sizing.ts (term и rowForOutput для workshop и plant, wholeCopies); src/engine/src/calc/types.ts (sizing у WorkshopRow и PlantRow); npm --prefix src/engine test — 36/36, «sizes an auto workshop in whole copies, the last one partly loaded»
