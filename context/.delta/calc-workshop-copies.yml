summary: цеха и заводы в «авто» подбираются целыми копиями; «Расформировать» стало «Раскрыть»; любая строка уходит в «В завод»; шапка и чипы — целые здания и копии
source: намерения основной сессии 2026-10-30; просьбы пользователя 2026-10-30 («цех … пытается найти нужное число… для последнего айтема цеха нужно занизить мощность работы и это должно указываться явно»; «поменяем расформировать на раскрыть»; «в завод можно не только цеха, но и просто те или иные рецепты»); npm --prefix src/engine test — 36/36; браузер 2026-10-30
