summary: чип баланса предметов кликается по знаку — отрицательный (дефицит, добыча) подбирает рецепт или добычу, положительный (цель, излишек) открывает «Нужно на выходе»
source: намерения основной сессии 2026-10-28 — уточнение к calc-goals-solver и calc-pick-consumption
items:
  - op: refine
    kind: rule
    target: context/conventions/ui-calc-pick-consumption.yml
    summary: клик по чипу баланса зависит от знака — отрицательный (дефицит, добыча) открывает «Добавить»; положительный (цель, излишек) открывает «Нужно на выходе» (см. ui-calc-goals); чип потребления в строке и «Итого» — подобрать рецепт, чип выхода — «Нужно на выходе»; правила разделены знаком
    evidence: src/ui/src/components/chips.tsx BalanceChip (onPick при perMinute < 0, onGoal при perMinute > 0); src/ui/src/components/rows.tsx (блок «Баланс предметов»)
  - op: refine
    kind: rule
    target: context/conventions/ui-calc-goals.yml
    summary: окно «Нужно на выходе» открывается и по чипу баланса с положительным знаком (цель, излишек) — не только по чипу выхода в строке или «Итого»
    evidence: src/ui/src/components/chips.tsx BalanceChip (onGoal при perMinute > 0); src/ui/src/components/rows.tsx (BalanceChip onGoal={editGoal})
