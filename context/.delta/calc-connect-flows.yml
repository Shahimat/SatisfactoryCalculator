summary: окно «Подключить цех» / «Подключить завод» без поля копий — строка ×1, копии подбирает решатель; у каждого варианта входы и выходы одной копии чипами
source: намерения основной сессии 2026-10-30; просьба пользователя 2026-10-30 («при выборе цеха незачем указывать число копий… стоит показать что у каждого цеха на выходе и на входе. Аналогично и для завода»); браузер 2026-10-30
