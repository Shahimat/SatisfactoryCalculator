summary: ответы по расчёту — лентами, справочник catalog, рецепт без энергии, мощность здания и петлевики
source: сессия 2026-10-28, намерения основной сессии; подтверждено Penpot Page 1 (Component 17), satisfactory.wiki.gg, src/engine/src/classes/Factory.ts
