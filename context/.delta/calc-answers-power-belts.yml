    kind: decision
    target: context/conventions/ui-calc-belt-units.yml
    summary: потоки расчёта можно показать в лентах — переключатель единиц в шапке; лент = шт/мин ÷ пропускная способность ленты Mk.1–Mk.6; жидкости — м³/мин ÷ труба Mk.1–Mk.2
    evidence: ответ пользователя 2026-10-28 («да, типа расчет производства через количество лент»); Penpot Page 1, Component 17; https://satisfactory.wiki.gg/wiki/Conveyor_Belts
