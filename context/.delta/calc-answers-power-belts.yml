    evidence: ответ пользователя 2026-10-28 («согласен» на дефолт catalog)
  - op: add
    kind: decision
    target: docs/entities/recipe.yml
    summary: рецепт задаёт входы, выходы и длительность цикла; собственной энергии у рецепта нет — энергия принадлежит зданию при заданном разгоне и усилении
    evidence: ответ пользователя 2026-10-28 («при разгоне меняется как сам рецепт, так и сильно деформируется затрачиваемая энергия»)
  - op: add
    kind: fact
    target: docs/entities/building.yml
    summary: мощность здания = базовая × (1 + заполненные слоты петлевиков / всего слотов)^2 × (разгон/100)^1.321928; разгон 1–250%, энергоосколок +50% к потолку (до 3); генераторы линейно; простой ≥ 0.1 МВт
    evidence: https://satisfactory.wiki.gg/wiki/Clock_speed; https://satisfactory.wiki.gg/wiki/Production_amplification
  - op: add
    kind: fact
    target: docs/entities/building.yml
    summary: петлевик — выход × (1 + заполненные/всего слотов), вход не растёт; слоты — 1 плавильня, конструктор; 2 — сборщик, литейная, нефтезавод, конвертер; 4 — производитель, смеситель, ускоритель, кодировщик
    evidence: https://satisfactory.wiki.gg/wiki/Production_amplification; https://satisfactory-calculator.com/en/items (Stable 1.2)
