key: ui-calc-build-cost
summary: внизу расчёта — «Ресурсы на постройку» — стоимость всех целых зданий плана по buildCost, энергомодулей и петлевиков, вставленных в здания; здания цехов × копии; заводы не входят — их строят в своём расчёте
rule: |
  Внизу расчёта — блок «Ресурсы на постройку»: предметы и количества, нужные,
  чтобы построить все здания плана.

  Считается по buildCost каталога (см. docs/entities/game-catalog.yml) для
  каждого целого здания: здания строк рецептов и добычи и здания цехов ×
  поставленные целые копии (см. ui-calc-workshop-copies). Дробная группа строки
  считается целым зданием.

  Сверх buildCost в ресурсы входят вставленные в здания предметы:
  - энергомодули — по одному на каждые 50 % разгона сверх 100 % у здания,
    округление вверх, не больше трёх (см. docs/entities/building.yml, clock);
  - петлевики — по одному на каждый заполненный слот петлевика.

  Заводы не входят: их постройка — в их собственном расчёте.

  Пример: 22 изготовителя → пластик 1100, кабель 1100, каркас 440, мотор 220.
  2 здания на 150 % → 2 энергомодуля; группа с петлевиками 2/4 → 2 петлевика.

  reason: пользователь 2026-10-29: «написать конкретно все эти ресурсы будет здорово»
