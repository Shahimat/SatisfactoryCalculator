key: ui-i18n-messages
summary: строки интерфейса — только в src/i18n/ru.ts (эталон, тип Messages) и en.ts; t читается при рендере, не в константах модуля; счётные слова — через countLabel и PluralForms
rule: |
  Строки интерфейса заводятся только в src/i18n/ru.ts (эталон, на него
  ссылается тип Messages) и src/i18n/en.ts. Компоненты берут строки через
  `t` из '../i18n'. `t` — live binding: значение меняется вместе с языком.

  Поэтому `t` читается при рендере. Константы уровня модуля, которые захватывают
  строку, при смене языка не обновятся.

  Счётные слова — через countLabel (src/calc.ts) и PluralForms: склонения
  по Intl.PluralRules, а не ручное «если … то».

  reason: словари без библиотеки (решение пользователя 2026-10-30); склонения ru/en и отсутствие кириллицы в en проверяет tests/i18n.spec.ts
