key: ui-import-conflicts
summary: импорт показывает содержимое со статусами «Новый» и «Уже есть» (по uuid); для совпадений одно решение на весь импорт — «Добавить копией» или «Заменить существующие»
rule: |
  При импорте показывается содержимое файла со статусами «Новый» и «Уже есть»
  (совпадение по uuid). Для совпадающих сущностей — одно решение на весь
  импорт: «Добавить копией» (по умолчанию: новый uuid и пометка «(импорт)»)
  или «Заменить существующие».

  reason: решение пользователя (2026-10-28, «Один выбор из пункта 2»)
