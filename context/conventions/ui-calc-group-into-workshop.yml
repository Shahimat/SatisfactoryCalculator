key: ui-calc-group-into-workshop
summary: выделенные строки расчёта кнопкой «В цех (N)» переносятся в новый цех; при выделении цеха или завода — кнопка «Раскрыть (N)» — сущность заменяется своими строками ×поставленных копий, в хранилище остаётся
rule: |
  Выделенные строки расчёта кнопкой «В цех (N)» переносятся в новый цех.
  На их месте в расчёте появляется строка этого цеха с множителем ×1.

  Если выделен хотя бы один цех или завод, кнопки «В цех» нет — вместо неё
  «Раскрыть (N)», где N — число выделенных цехов и заводов. Раскрыть — сущность
  заменяется своими строками: новые id, здания и закреп строк умножаются на
  поставленные копии. Цех или завод в хранилище остаётся, его можно собрать заново.

  reason: пересмотрено пользователем (2026-10-30) — «при нажатии на цех не нужно кнопки в цех, нужно уметь только расформировать цех и потом заново собрать»; «расформировать» переименовано в «раскрыть» (пользователь 2026-10-30: «поменяем расформировать на раскрыть»); первая версия — решение пользователя (2026-10-28), мотивация не записана
