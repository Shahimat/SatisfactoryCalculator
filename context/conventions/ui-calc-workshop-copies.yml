key: ui-calc-workshop-copies
summary: чип копий цеха или завода — ×целых копий, тег «последняя N %» при неполной загрузке, «авто» или «закреплено»; в окне правки — «Авто» / «Зафиксировать копии»
rule: |
  Цех или завод в расчёте показан чипом копий: ×N — число поставленных целых
  копий.

  Если последняя копия загружена не полностью, рядом тег «последняя N %»:
  например, 1.25 копии — ×2 и «последняя 25 %». Неполная копия работает с
  пониженной загрузкой, дробного числа копий в расчёте нет.

  Режим копий:
  - «авто» — решатель подбирает целые копии; тег «авто»;
  - «закреплено» — копии заданы в окне правки, решатель их не меняет.

  В окне правки строки цеха или завода — «Авто» и «Зафиксировать копии» с
  полем числа копий. Закреплённые цеха подсвечиваются как закреплённые строки
  (см. ui-calc-fixed-row-highlight).

  Расчёт решателя — см. docs/behavior/calc-plan-solver.yml.

  reason: пользователь 2026-10-30 — «цех … пытается найти нужное число. Если не выходит, то для последнего айтема цеха нужно занизить мощность работы и это должно указываться явно»
