key: data-browser-storage
summary: расчёты, цеха и заводы хранятся в браузере пользователя; обмен — файлом JSON через экспорт и импорт, сервера нет
rule: |
  Расчёты, цеха и заводы пользователя хранятся в браузере. Сервера и учётных
  записей нет. Обмен расчётами — только через экспорт и импорт JSON-файла:
  правила экспорта — ui-export-selection, импорта — ui-import-conflicts.

  reason: сайт статический; решение пользователя (2026-10-28, «сайт и возможность обменяться расчетами через импорт/экспорт»)
