key: ui-i18n-locale-switch
summary: переключатель RU/EN — в верхней панели рядом с «Единицами»; первый заход — язык браузера; выбор хранится в localStorage satisfactory-calculator/locale, не в состоянии и не в экспорте
rule: |
  Переключатель языка RU/EN стоит в верхней панели рядом с переключателем единиц
  (src/App.tsx). Смена языка применяется сразу, без перезагрузки страницы.

  При первом заходе язык берётся из браузера: русский — ru, любой другой — en.
  Выбор пользователя сохраняется в localStorage под ключом
  satisfactory-calculator/locale (src/i18n/index.ts).

  Язык не входит в состояние расчёта и не попадает в экспорт: файл расчёта
  не зависит от того, на каком языке его открыли.

  reason: решение пользователя (2026-10-30, пункты 1.1 и 2.1); смена без перезагрузки и сохранение выбора проверены в headless Chrome
