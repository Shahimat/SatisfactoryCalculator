key: ui-select-icons
summary: выпадающие списки — свой компонент Select с иконками игры и поиском от 10 вариантов; системный select картинки не показывает
rule: |
  Выпадающие списки интерфейса — свой компонент Select
  (src/ui/src/components/select.tsx), не системный select: он не умеет
  показывать картинки.

  В вариантах — иконки игры: предметы, здания, ресурсы, топливо, петлевики.

  Поиск в списке появляется от 10 вариантов; короче — без поиска.

  reason: просьба пользователя (2026-10-28): «аналогично для выпадающих списков» — объекты узнаются по иконке раньше, чем по названию
