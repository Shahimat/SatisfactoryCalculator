key: ui-calc-amplify-groups
summary: петлевики в строке расчёта задаются группами зданий в одной фишке (например ×8 без и ×2 с ◆1/1); в настройках строки — кнопка «Группа с другим разгоном»; в шапке расчёта — число использованных петлевиков
rule: |
  Петлевики задаются группами зданий в одной фишке здания: например ×8 без
  петлевика и ×2 с петлевиком ◆1/1 (заполненные слоты из всех). Фишка окрашена
  токеном ui.flow.amplify, иконка — icon/somersloop, компонент factory-chip/amplified.
  В шапке расчёта показано число использованных петлевиков. Слоты по зданиям —
  docs/entities/building.yml.

  Группа — часть зданий строки со своим разгоном и петлевиками. В настройках
  строки кнопка «Группа с другим разгоном» добавляет группу; подсказка объясняет,
  что это: например, 8 зданий на 100 % и 2 с петлевиками.

  reason: решение пользователя (2026-10-28, «1. Группы в строке»); кнопка и подсказка по вопросу пользователя 2026-10-29 «что тут за +группа?»
