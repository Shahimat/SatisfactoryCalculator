key: ui-calc-add-recipe
summary: рецепт в расчёт добавляется от цели — предмет, выход и разгон, затем предложение рецептов с итогом
rule: |
  Рецепт в расчёт добавляется от цели. Пользователь выбирает предмет,
  нужный выход и разгон. Система предлагает рецепты — стандартные и ALT —
  и сразу показывает итог: число зданий, вход, выход, энергию.
  В «Добавить рецепт» есть поле «Петлевики» — число усиленных зданий.

  reason: решение пользователя (2026-10-28), мотивация не записана
