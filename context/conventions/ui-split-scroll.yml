key: ui-split-scroll
summary: раздельная прокрутка — верхняя панель и левое меню на месте, контент прокручивается отдельно; шапка страницы и заголовки расчёта с карточкой «Итого» прилипают сверху контента
rule: |
  Верхняя панель приложения стоит на месте и не прокручивается.

  Левое меню и область контента прокручиваются раздельно: прокрутка контента
  не двигает меню.

  Шапка страницы (название, режим расчёта, кнопки) прилипает к верху области
  контента и не уезжает при прокрутке.

  В расчёте под шапкой страницы прилипают и заголовки колонок с карточкой
  «Итого» (вместе с предупреждением о недостижимых целях): они остаются
  видны, пока прокручиваются строки. Прокручиваются только строки расчёта и
  блок «Ресурсы на постройку» внизу.

  Полосы прокрутки тёмные (цвет --border-default), под цвет интерфейса.

  reason: просьба пользователя (2026-10-30): «при прокрутке контента расчета не нужно трогать левое меню… шапку расчета тоже не прокручивать»; «Итого» тоже не прокручивать, пусть будет в зоне шапки (пользователь 2026-10-30)
