key: data-version-update
summary: "расчёт из файла или сохранённый на другой версии игры пересчитывается по новым данным; плашка «Данные игры обновились: X → Y», изменённые рецепты — оранжевая рамка, удалённые — красная, «замените»"
rule: |
  Если файл или сохранённый расчёт собран на другой версии игры, расчёт
  пересчитывается по данным текущей версии. Сверху показывается плашка
  «Данные игры обновились: X → Y». Изменённые рецепты — оранжевая рамка и
  пояснение. Удалённые рецепты — красная рамка, значения приглушены, рядом
  «замените».

  reason: решение пользователя (2026-10-28, «1. Предупредить и подсветить»)
