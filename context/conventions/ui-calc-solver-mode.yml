key: ui-calc-solver-mode
summary: режим расчёта «Матрица» (по умолчанию для новых) или «Сверху вниз»; «Матрица» решает все строки «авто» вместе, недостижимые цели — плашка
rule: |
  У расчёта и цеха есть режим расчёта строк: «Матрица» или «Сверху вниз».
  Новый расчёт и новый цех — «Матрица».

  «Матрица»: все строки «авто» решаются вместе линейной программой —
  покрыть цели, не допустить дефицита того, что производят строки «авто»,
  минимум зданий. Порядок строк не важен. Петли с возвратом (вода в
  алюминии) сходятся. Недостижимые цели показываются плашкой.

  «Сверху вниз»: строка «авто» покрывает цели и то, чего не хватает строкам
  выше. Порядок строк важен — см. ui-calc-row-order.

  Закреплённые строки и закреплённые копии цехов и заводы входят в расчёт как
  есть. Здания с петлевиками считаются как заданы; решатель подбирает здания
  без петлевиков. Цеха и заводы в «авто» подбираются решателем целыми копиями —
  см. ui-calc-workshop-copies.

  reason: helmod плохо считает петлю — алюминий, возврат воды; строка должна покрывать строки выше именно при режиме «Сверху вниз», как в Helmod (просьба пользователя, 2026-10-28); проверено в браузере — алюминий 60/мин: вода 270 − 30 возврат = 240 насосами
