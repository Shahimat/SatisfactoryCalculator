key: ui-no-text-selection
summary: выделение текста в интерфейсе отключено — экран из карточек; в полях ввода выделение работает
rule: |
  Выделение текста в интерфейсе отключено: на уровне страницы выделять
  нечего — экран состоит из карточек и кнопок.

  Выделение и редактирование текста остаются только в полях ввода
  (input, textarea).

  reason: просьба пользователя (2026-10-28): «уберем выделение контента, тут все равно нечего выделять, кругом одни карточки»
