key: ui-reference-readonly
summary: справочник (рецепты, здания, предметы) только для чтения — редакторов нет; в шапке версия данных игры и дата сборки; у зданий колонка «Петлевики»
rule: |
  Справочник только для чтения: редакторов рецепта, здания и предмета нет.
  В шапке справочника — версия данных игры и дата сборки. У зданий есть
  колонка «Петлевики» — слоты из docs/entities/building.yml.

  reason: данные меняются только вместе со сменой версии игры; решение пользователя (2026-10-28, план переработки)
