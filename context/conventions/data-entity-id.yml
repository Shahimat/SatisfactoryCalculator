key: data-entity-id
summary: сущности пользователя (расчёты, цеха, заводы) получают uuid; импорт сопоставляет по uuid, копия получает новый uuid
rule: |
  Расчёты, цеха и заводы пользователя получают uuid вместо числового id.
  Импорт сопоставляет сущности по uuid. Копия при импорте получает новый uuid.

  reason: импорт между браузерами сопоставляет сущности без общей базы; решение пользователя (2026-10-28, «Нужно тогда сделать id -> uuid»)
