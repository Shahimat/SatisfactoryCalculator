key: ui-calc-group-into-plant
summary: у любой выделенной строки расчёта кнопка «В завод (N)» — строки уходят в новый расчёт-завод «Завод из «…»», на их месте строка завода ×1
rule: |
  У выделенных строк расчёта — любых: рецепта, добычи, цеха — кнопка «В завод (N)».
  Строки переносятся в новый расчёт-завод «Завод из «…»», на их месте в исходном
  расчёте появляется строка этого завода с множителем ×1.

  Завод — ссылка на расчёт с множителем копий (см. ui-calc-workshop-copies и
  CHANGELOG: завод — ссылка на расчёт с множителем ×N).

  reason: пользователь 2026-10-30 — «в завод можно не только цеха, но и просто те или иные рецепты»
