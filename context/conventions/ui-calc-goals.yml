key: ui-calc-goals
summary: цель вводится прямо в чипе выхода «Итого» — число и Enter задают цель, пустое поле и Enter или уход из поля снимают, и закреп строк на этот продукт снимается (строки → авто); цель отмечена значком мишени; окна «Нужно на выходе» нет; цель можно поставить промежуточному продукту
rule: |
  Цель расчёта — предмет и количество в минуту, которое должно выйти.
  Цели задают объём расчёта в режимах «Матрица» и «Сверху вниз» (см.
  ui-calc-solver-mode).

  Цель вводится прямо в чипе: клик по чипу выхода в «Итого» открывает поле ввода.
  Положительного чипа баланса, который задавал бы цель, нет: баланс убран.
  Число и Enter задают цель, пустое поле и Enter её снимают. Уход из поля без
  Enter снимает цель, если поле пусто; число при уходе из поля не применяется.
  Esc отменяет. Окна «Нужно на выходе» нет.

  Любое применение ввода в чипе «Итого» — число и Enter, пустое поле и Enter,
  уход из пустого поля — правит итог продукта целиком: снимает закреп выхода
  у строк на этот продукт, такие строки становятся «авто». Итог — то, что
  введено, без остатка от закрепа строки.

  Цель отмечена на чипе значком мишени. Чип выхода строки рецепта или добычи
  того же продукта тоже отмечает цель мишенью; очистка этого чипа снимает и
  закреп строки, и цель (см. ui-calc-row-output).

  Подбор рецепта по входу — см. ui-calc-pick-consumption.

  Выход строки рецепта или добычи закрепляет строку, а не ставит цель — см.
  ui-calc-row-output. Выход строки цеха или завода цели не задаёт — см.
  ui-calc-row-order.

  Цель можно поставить и промежуточному продукту — тогда его выходит больше.

  reason: выход задаётся целью, а не запасом строки — «Запас сверх потребности» убран по решению пользователя (2026-10-28, «так не надо делать»); ввод прямо в чипе — тот же простой ввод, что у выхода строки (пользователь 2026-10-29); окно «Нужно на выходе» убрано по просьбе «дополнительных кнопок здесь не нужно» (2026-10-29); положительный чип баланса убран вместе с балансом (пользователь 2026-10-29: «пишет то же самое, что и Итого»); закреп строки снимается из «Итого» (пользователь 2026-10-30: «я убрал в итого зафиксированное значение скоростного разъема и он не пересчитался… не убрался с вкладки итого»; проверено в браузере 2026-10-30 — разъём закреплён на 10, очистка «Итого» → строка авто ×1 66.67 %, разъём ушёл из «Итого»)
