key: data-game-sources
summary: исходные файлы игры кладутся вручную в data/raw/<версия>/; CI нормализует их в каталог, подтягивает иконки с вики с кешем и паузами, собирает и публикует сайт
rule: |
  Файлы игры en-US.json и ru.json (из CommunityResources/Docs/) кладутся
  вручную в data/raw/<версия>/ вместе с source.json (версия, сборка, ветка,
  sha256 файлов); сборка проверяет хеши. Состав каталога и правила сборки —
  entity game-catalog, процедура — manual data-add-game-version. CI нормализует
  их в каталог справочника, подтягивает
  иконки с satisfactory.wiki.gg с кешем и паузами между запросами, собирает
  и публикует сайт. Сторонние калькуляторы источником данных не являются.

  reason: satisfactory-calculator.com не даёт API и условий повторного использования; решение пользователя (2026-10-28, вариант «гибрид»)
