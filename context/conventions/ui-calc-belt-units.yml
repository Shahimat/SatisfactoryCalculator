key: ui-calc-belt-units
summary: потоки расчёта можно показать в лентах — переключатель единиц в шапке расчёта; число лент = шт/мин ÷ пропускная способность ленты выбранного уровня
rule: |
  В шапке расчёта есть переключатель единиц: поток можно показать в лентах.

  Число лент = штуки в минуту ÷ пропускная способность ленты выбранного
  уровня. Жидкости — м³/мин ÷ пропускная способность трубы выбранного уровня.

  Пропускная способность:
  - лента, шт/мин: Mk.1 60, Mk.2 120, Mk.3 270, Mk.4 480, Mk.5 780, Mk.6 1200;
  - труба, м³/мин: Mk.1 300, Mk.2 600.

  reason: решение пользователя (2026-10-28); значения — satisfactory.wiki.gg/wiki/Conveyor_Belts
