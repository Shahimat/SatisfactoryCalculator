key: ui-flow-direction-colors
summary: направление потока кодируется цветом — вход красный, выход зелёный, жидкость синяя, энергия жёлтая молния
rule: |
  Направление потока в расчёте показывается цветом:
    - вход — красный;
    - выход — зелёный;
    - жидкость — синий;
    - энергия — жёлтая молния.

  reason: по цвету видно направление потока без чтения подписей
