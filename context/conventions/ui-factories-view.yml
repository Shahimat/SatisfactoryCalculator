key: ui-factories-view
summary: раздел «Заводы» — построенные расчёты («Построено ×N» или «Черновик») и сводка энергосети сверху
rule: |
  В разделе «Заводы» каждый расчёт показан как «Построено ×N» или
  «Черновик». Черновик не учитывается в энергосети.

  Сверху раздела — сводка энергосети (генерация, потребление, запас,
  загрузка) и выпуск всех заводов.

