key: ui-field-anchor-icons
summary: поля окон расчёта — иконки-якоря (здание, энергомодуль, петлевик, предмет); окно правки строки открывается шапкой с иконкой здания и рецептом
rule: |
  У полей окон расчёта есть иконки-якоря — по ним видно, какой объект правится:
  - здание — у поля «Здание» (окно добавления строки);
  - энергомодуль — у поля «Разгона»;
  - петлевик — у поля «Петлевики»;
  - предмет — у поля выхода и у поля запаса.

  Окно правки строки открывается шапкой: иконка здания, название рецепта
  с ALT, если рецепт альтернативный, и строка «что делает одно здание» —
  рецепт на 1 здание при 100 %.

  reason: просьба пользователя (2026-10-28): «не вижу визуальных якорей, что за объект правлю, что за петлевики… добавь иконки»
