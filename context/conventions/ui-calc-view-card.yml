key: ui-calc-view-card
summary: основной вид расчёта карточный — «Итого» первой карточкой над строками; строка = рецепт | цепь | завод | итог; баланс по предметам не показывается
rule: |
  Основной вид расчёта — карточный. «Итого» стоит первой карточкой над строками —
  см. ui-calc-build-strip. Строка — это рецепт | цепь | завод | итог.

  Баланс по предметам (цель, излишек, добыча, дефицит) отдельным блоком не
  показывается: он повторял «Итого». Недостача и излишек видны в «Итого».

  reason: решение пользователя (2026-10-28), мотивация не записана; баланс убран по просьбе пользователя (2026-10-29): «пишет то же самое, что и Итого, давай уберём»
