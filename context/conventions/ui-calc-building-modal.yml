key: ui-calc-building-modal
summary: окно «Здание» по клику на чип зданий строки — здание и рецепт, построить целых и загрузка, энергия, потоки одного здания по группам и всей строки, стоимость постройки одного здания и всех; показывает число зданий после решателя
rule: |
  Окно «Здание» открывается кликом по чипу зданий строки и показывает:
  - здание и рецепт;
  - сколько целых зданий построить и загрузку;
  - энергию;
  - потоки одного здания по каждой группе строки (разгон, петлевики);
  - потоки всей строки;
  - стоимость постройки одного здания и всех целых зданий строки — см.
    ui-calc-build-cost.

  Окно показывает число зданий, которое получил решатель, а не введённое в
  настройках строки. Правка числа и разгона — в окне настроек строки, см.
  ui-calc-row-card.

  reason: пользователь 2026-10-29 — чип зданий раньше открывал настройки строки с введённым числом; теперь чип открывает окно «Здание» с числом решателя; проверено в браузере 2026-10-29: Скоростной разъём ×13.067, построить 14, мотор 10 / 140
