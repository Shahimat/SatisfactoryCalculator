key: ui-accent-yellow
summary: жёлтый акцент — только для действий и выделения; жёлтая молния энергии в потоке — исключение
rule: |
  Жёлтый акцент используется только для действий (кнопки, призывы) и
  выделения. Исключение — жёлтая молния энергии в потоке расчёта
  (см. ui-flow-direction-colors): это семантика потока, не акцент.

  reason: акцент работает, пока он редкий и означает «нажми» или «смотри сюда»
