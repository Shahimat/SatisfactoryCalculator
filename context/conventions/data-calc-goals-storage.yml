key: data-calc-goals-storage
summary: расчёт и цех хранят goals [{item, perMinute}] и solver вместо targets; строка рецепта или добычи хранит output {item, perMinute} — закреп выхода продукта; старые расчёты переводятся при загрузке и импорте в цели и режим «Сверху вниз»
rule: |
  Расчёт и цех хранят `goals: [{item, perMinute}]` и `solver: 'sequential' |
  'matrix'` вместо `targets`.

  Строка рецепта или добычи хранит `output: {item, perMinute}` — закреплённый
  выход одного продукта (см. ui-calc-row-output) — и `sizing: 'auto' | 'fixed'`.
  Строка с `output` не «авто»: здания под него считает движок, и она решается
  как fixed в обоих режимах.

  Старые расчёты переводятся сами — при загрузке из хранилища и при импорте
  файла: `targets` становятся целями в том объёме, который давали строки;
  режим — «Сверху вниз». Новые расчёты и цеха — «Матрица».

  reason: совместимость сохранённых расчётов и файлов обмена — src/ui/src/model.ts (Plan), src/ui/src/calc.ts (migratePlan, isAutoRow), src/ui/src/store.ts, src/ui/src/components/exchange-modals.tsx; закреп на уровне продукта — src/engine/src/calc/types.ts (LockedOutput, RecipeRow.output, ExtractorRow.output), решение 2026-10-29
