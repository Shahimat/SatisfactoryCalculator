key: ui-calc-header
summary: шапка расчёта — строки, поставленные целые здания и петлевики; перечня целей в шапке нет, цели видны значком мишени на чипах «Итого»
rule: |
  В шапке расчёта показано: число строк, число поставленных целых зданий и число
  использованных петлевиков (см. ui-calc-amplify-groups). Здания цехов считаются
  с поставленными копиями, частично загруженная копия — целиком; дробная
  загрузка в шапке не показывается. Здесь же переключатель единиц лент
  (см. ui-calc-belt-units).

  Перечня целей в шапке нет. Цели видны значком мишени на чипах выхода «Итого»
  — см. ui-calc-goals.

  reason: пользователь (2026-10-30) — «Цели: автопроводка… убери это просто, оно не нужно»
