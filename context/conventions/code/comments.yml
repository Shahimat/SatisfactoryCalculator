key: comments
summary: комментарии только для неочевидного «почему»; по умолчанию их нет
rule: |
  По умолчанию комментариев в коде нет. Хорошо названные функции,
  переменные и типы — это и есть документация. Если строка непонятна
  без комментария, обычно лучше переименовать или переструктурировать,
  а не комментировать.

  Комментарий оправдан только когда фиксирует то, чего в самом коде
  не видно:
    - неочевидное «почему»: скрытое ограничение, инвариант, доменное
      правило, workaround известной проблемы;
    - ссылка на внешний контекст: конкретный тикет / PR / RFC, если он
      меняет смысл читаемого;
    - предупреждение о неявной зависимости — порядок вызовов, гонка,
      ограничение библиотеки или платформы.

  Комментария быть не должно, если он:
    - пересказывает то, что уже понятно из кода;
    - относится к текущей задаче, PR или ревью — это живёт в описании
      PR и в CHANGELOG.md, не в коде: комментарий такого рода быстро
      теряет привязку и превращается в шум;
    - фиксирует TODO / FIXME без ссылки на тикет и владельца;
    - сохраняет закомментированный код «на всякий случай» — для
      этого есть git-история.

  JSDoc / TSDoc на публичных API — не комментарии в смысле этого
  правила: они часть контракта модуля. Пишем их, когда язык или
  фреймворк этого ожидает, но не превращаем в пересказ реализации.
