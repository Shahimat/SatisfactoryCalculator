key: ui-calc-row-card
summary: карточка строки без чекбокса — клик выделяет и снимает выделение; название переносится и кликается только по тексту (inline), клик по пустому месту рядом выделяет карточку; клик по названию открывает настройки строки, клик по чипу зданий — окно «Здание»; подписи здания и выхода на здание нет
rule: |
  Карточка строки не имеет чекбокса. Клик по карточке выделяет её и снимает
  выделение; выделенные строки переносятся кнопкой «В цех (N)», выделенные
  цех или завод — кнопкой «Раскрыть (N)» — см. ui-calc-group-into-workshop
  и ui-calc-group-into-plant.

  Название строки переносится на несколько строк, без многоточия. Название —
  кнопка только по своему тексту (inline, role=button): клик по пустому месту
  карточки рядом с перенесённым названием выделяет карточку, а не открывает
  настройки. Подписи «здание · N шт/мин на здание» под названием нет. У строки
  добычи вместо здания показан узел. Статусы строки («закреплено», «авто»)
  остаются — см. ui-calc-fixed-row-highlight.

  Клик по названию строки открывает окно правки строки: объём, разгон,
  петлевики, копии. Окно показывает число зданий, которое получил решатель.
  Клик по чипу зданий открывает окно «Здание» — см. ui-calc-building-modal.

  reason: пользователь 2026-10-29 — чекбокс и подпись убраны, название читается целиком; название — настройки, здание — окно здания; пользователь 2026-10-30 — «расформировать» переименовано в «раскрыть»
