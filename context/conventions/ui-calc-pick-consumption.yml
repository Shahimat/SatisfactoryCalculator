key: ui-calc-pick-consumption
summary: клик по чипу потребления в строке или в «Итого» открывает «Добавить» с предметом и количеством; сырьё — во вкладке «Добыча»; подобранный рецепт не становится целью
rule: |
  Клик по чипу потребления в строке расчёта или в «Итого» открывает окно
  «Добавить» с этим предметом и нужным количеством.

  Баланс предметов отдельным блоком не показывается, поэтому чипа баланса
  (дефицит, добыча, излишек, цель) тоже нет. Чип выхода в «Итого» вводит цель
  в чипе — см. ui-calc-goals. Чип выхода строки рецепта или добычи вводит закреп
  выхода в чипе — см. ui-calc-row-output. Потребление и выход разделены
  знаком, правила не конфликтуют.

  Сырьё (ресурс) открывается во вкладке «Добыча» с подходящим зданием и
  числом зданий. Предмет с рецептом открывается во вкладке «Рецепт».

  Рецепт, подобранный так, не становится целью расчёта: это промежуточный
  продукт, строка добавляется без пометки цели.

  Строка, подобранная так, получает режим «авто» — см. ui-calc-row-order.

  reason: просьба пользователя (2026-10-28): «не могу нажать на иконку потребления, чтобы добавить цепочку»; окна «Нужно на выходе» и «Выход строки» убраны (2026-10-29); чип баланса убран вместе с балансом (пользователь 2026-10-29: «пишет то же самое, что и Итого, давай уберём»)
