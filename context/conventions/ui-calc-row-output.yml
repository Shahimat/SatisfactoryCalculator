key: ui-calc-row-output
summary: выход строки рецепта или добычи закрепляется прямо в чипе выхода — число и Enter закрепляют строку на этом продукте, пустое поле и Enter или уход из поля возвращают «авто» и снимают цель плана на этот продукт, Esc отменяет; чип отмечает цель мишенью; окон и кнопок нет
rule: |
  Чип выхода строки рецепта или добычи редактируется на месте: клик открывает
  поле ввода в самом чипе. Окна «Выход строки» нет.

  Число и Enter закрепляют строку на этом продукте: её выход по продукту равен
  заданному числу в минуту. К числу ничего не прибавляется: потребление других
  строк не учитывается. Недостача видна в «Итого».

  Закреплён один продукт строки; закрепить можно и побочный. Остальные продукты
  строки выводятся из закреплённого выхода. Замок на чипе закреплённого
  продукта — см. ui-calc-fixed-row-highlight.

  Пустое поле и Enter возвращают строку в «авто». Уход из поля без Enter делает
  то же для пустого поля; число при уходе из поля не применяется. Esc отменяет
  ввод.

  Очистка чипа снимает и закреп, и цель плана на этот продукт: с продукта
  ничего не требуется, строка «авто». Если цели на этот продукт нет, очистка
  снимает только закреп.

  Выход строки закрепляет строку, а не задаёт выход плана: закреп сам по себе
  цели не ставит. Но чип выхода отмечает цель плана на этот продукт значком
  мишени — см. ui-calc-goals; цель задаётся в «Итого». Выход цеха и завода в чипе
  не редактируется — см. ui-calc-row-order.

  reason: цель — чистый выход плана; закреп на продукте даёт точное число, а не цель (пользователь 2026-10-29: «я конкретное число указал»); простой ввод в чипе вместо окна и кнопок (пользователь 2026-10-29: «очень много кнопок… давай проще»); очистка по уходу из поля тоже возвращает «авто» (пользователь 2026-10-29: «в авто не переводится после удаления»); очистка снимает цель на этот продукт, иначе строка возвращается к прежнему выходу (пользователь 2026-10-29: «чищу строку, жму энтер и возвращается как было»); мишень на чипе — чтобы видеть, что цель на продукте есть; проверено в браузере 2026-10-29 — разъём 5 → замок на чипе, пусто → авто ×3.2, стереть 7 и кликнуть мимо → авто; цели автопроводка 60 и разъём 34, очистка чипа разъёма → цель снята, разъём 49 → 15
