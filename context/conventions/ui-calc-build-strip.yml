key: ui-calc-build-strip
summary: «Итого» стоит первой карточкой над строками расчёта; здания к постройке — компактные чипы в колонке «Здания» карточки «Итого» (иконка и ×целых, имя во всплывашке); цеха и заводы — значок, ×копий, имя; отдельной полосы нет
rule: |
  «Итого» — первая карточка расчёта, над всеми строками.

  В колонке «Здания» карточки «Итого» перечислено, что строить, — компактными
  чипами:
  - здания по типам — иконка здания и ×N целых зданий; имя здания — во
    всплывашке; дробная группа строки считается целым зданием;
  - цеха — значок цепи, ×целых копий и имя цеха (см. ui-calc-workshop-copies);
  - заводы — значок завода, ×целых копий и имя завода.

  Отдельной полосы «Построить» нет: она занимала много места на маленьких
  экранах.

  reason: пользователь 2026-10-29: на маленьких экранах «Итого» занимает много места
