key: ui-export-selection
summary: экспорт выборочный — чеклист расчётов, цехов и заводов и «Выбрать всё — полный бэкап»; зависимости включаются автоматически с пометкой «нужен для …»
rule: |
  Экспорт выборочный: чеклист расчётов, цехов и заводов. Кнопка «Выбрать всё»
  даёт полный бэкап. Зависимости включаются автоматически с пометкой
  «нужен для …»: цехи и заводы расчёта, расчёт, на который ссылается завод.

  reason: решение пользователя (2026-10-28, «выборочно, что хотим, то и экспортируем, включая все»)
