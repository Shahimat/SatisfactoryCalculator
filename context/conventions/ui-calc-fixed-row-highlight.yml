key: ui-calc-fixed-row-highlight
summary: строка, закреплённая числом зданий, подсвечена жёлтой полосой слева и тегом «закреплено» в чипе зданий; строка, закреплённая выходом продукта, — замок на чипе этого продукта и на чипе «Итого» (если цели нет); строка «авто» — тег «авто»
rule: |
  Строка рецепта или добычи, закреплённая числом зданий (режим
  «зафиксировать здания»), подсвечивается: жёлтая полоса слева у строки и тег
  с замком «закреплено» в чипе зданий. Цвет полосы — токен
  --accent-primary-bg.

  Строка, закреплённая выходом продукта (см. ui-calc-row-output), жёлтой
  полосы и тега «закреплено» не получает. Замок стоит на чипе закреплённого
  продукта: рецепт может производить несколько продуктов, и важно видеть,
  какой именно закреплён. Остальные продукты строки выводятся из него.

  Чип «Итого» того же продукта получает замок, если строка закреплена на нём
  и цели на продукт нет. Если цель есть, чип отмечен мишенью — см.
  ui-calc-goals; замок тогда не показывается.

  Цех или завод с закреплёнными копиями подсвечивается так же: жёлтая полоса
  слева и тег «закреплено».

  Строка в режиме «авто» получает тег «авто» с подсказкой «Число зданий
  подбирает решатель».

  reason: пользователь 2026-10-29: «так как я явно зафиксировал число… он зафиксированный, нужно это явно как-то подсветить»; «рецепт может производить много элементов, лучше видеть, какой конкретно закреплён»; замок на «Итого» — чтобы видно было закреп строки в итоге продукта; проверено в браузере 2026-10-30 — разъём закреплён на 10, в «Итого» +7.5 с замком
