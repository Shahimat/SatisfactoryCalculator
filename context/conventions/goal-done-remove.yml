key: goal-done-remove
summary: полностью выполненная цель удаляется из очереди без отдельного вопроса — файл goal--<key>.yaml и строка в goals.yaml; история — в git и CHANGELOG
rule: |
  Цель, полностью решённая, удаляется по жизненному циклу skill goals: файл
  goal--<key>.yaml, строка в goals.yaml, зависимости от неё снимаются.
  Отдельного подтверждения пользователя не нужно. Запись в CHANGELOG — только
  если решение проходит критерий журнала.

  reason: решение пользователя (2026-10-28, «да (как и все другие цели, если они выполнены)»); история сохраняется в git
