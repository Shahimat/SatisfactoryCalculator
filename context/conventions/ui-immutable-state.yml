key: ui-immutable-state
summary: состояние UI иммутабельно — правки новыми объектами плана, цеха или расчёта; результат evaluate общий из кеша и не мутируется
rule: |
  Правки состояния — только новыми объектами: плана, цеха или расчёта.
  setState(update) возвращает новое состояние (src/ui/src/store.ts).

  Результат evaluate общий из кеша: кеш привязан по ссылке на план и сверяет
  цеха и заводы, от которых план зависит (WeakMap по плану, зависимости
  сравниваются по ===). Поэтому ввод не пересчитывает решатель по всем планам.

  Мутация результата портит кеш или делает его устаревшим.

  reason: кеш по ссылкам работает только при иммутабельных обновлениях
