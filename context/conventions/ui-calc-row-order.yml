key: ui-calc-row-order
summary: порядок строк задаёт снабжение только в режиме «Сверху вниз» — строка «авто» покрывает цели и нехватку выше; в «Матрице» порядок не влияет; режим строки — «авто» / «зафиксировать здания»; выход цеха и завода в чипе не редактируется
rule: |
  В режиме расчёта «Сверху вниз» (см. ui-calc-solver-mode) порядок строк
  определяет снабжение. Строка рецепта или добычи в режиме «авто» покрывает
  цели и чистую нехватку своего продукта у строк выше неё: расчёт идёт
  сверху вниз. Поэтому перестановка строк перетаскиванием за ручку
  пересчитывает объёмы.

  В режиме «Матрица» все строки «авто» решаются вместе; порядок строк на
  объёмы не влияет.

  Строка «авто» без потребителей выше неё показывает подсказку
  «перетащите ниже потребителей» — только в режиме «Сверху вниз».

  Режим строки «авто» / «зафиксировать здания» переключается в окне правки
  строки. По умолчанию:
  - строка без явного режима — «авто», если у плана есть цели;
  - иначе — «зафиксировать здания»;
  - строка, подобранная кликом по потреблению, — «авто».

  В окне правки строки в «Авто» и у строки с закреплённым выходом (см.
  ui-calc-row-output) есть поле «Зданий»: пусто — решатель подбирает целые
  здания с ровным разгоном; число — здания заданы, разгон подстраивается под
  выход до максимума здания. Разгон в этих режимах только показывается.
  Закреплённый выход сохраняется. Петлевики задаются отдельными группами.
  «Авто» снимает закреп выхода, сбрасывает разгон на 100 % и возвращает строку
  решателю.

  Для цеха и завода режим в окне правки — «авто» или «зафиксировать копии»;
  число копий задаётся там же. Выход строки цеха и завода в чипе не
  редактируется. Выход строки рецепта или добычи — закрепление, см.
  ui-calc-row-output.

  reason: режим «Матрица» снимает зависимость от порядка, порядок остаётся для «Сверху вниз» (решение пользователя, 2026-10-28); кейс с проволокой — статор выше проволоки: проволока ×20 → ×28, +840 шт/мин; окно цели убрано, копии цеха и завода — в окне правки (2026-10-29)
