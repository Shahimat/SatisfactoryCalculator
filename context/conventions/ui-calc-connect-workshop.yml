key: ui-calc-connect-workshop
summary: цех и завод подключаются модалкой «Подключить цех» / «Подключить завод» без поля копий — строка ×1, копии подбирает решатель; у каждого варианта входы и выходы одной копии чипами
rule: |
  Цех или завод подключается в расчёт через модалку «Подключить цех» /
  «Подключить завод». Поля копий в ней нет: строка добавляется ×1, число
  копий подбирает решатель (см. ui-calc-workshop-copies).

  У каждого варианта в списке показаны входы и выходы одной копии
  чипами.

  Строки подключённого цеха в расчёте можно свернуть в один блок.

  reason: пользователь (2026-10-30) — число копий при подключении не нужно, решатель подбирает копии; нужно видеть, что цех берёт и отдаёт за одну копию
