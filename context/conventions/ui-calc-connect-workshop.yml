key: ui-calc-connect-workshop
summary: цех подключается в расчёт модалкой «Подключить в расчёт» с множителем копий; строки цеха сворачиваются в блок
rule: |
  Цех подключается в расчёт через модалку «Подключить в расчёт», где
  задаётся множитель копий.

  Строки подключённого цеха в расчёте можно свернуть в один блок.

