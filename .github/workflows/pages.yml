name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Game catalog
        run: npm run data:catalog

      # UI tests read the built catalog.
      - name: Test
        run: |
          npm test -- --run
          npm run typecheck
          npm run lint

      # wiki.gg rate-limits downloads; icons survive between runs and only new ones are fetched.
      - uses: actions/cache@v4
        with:
          path: data/icons
          key: icons-${{ hashFiles('data/raw/*/source.json') }}
          restore-keys: icons-

      - name: Icons
        run: npm run data:icons

      - name: Build site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
